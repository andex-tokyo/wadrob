name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: fast checks (worker + flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/api/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: install worker dependencies
        run: npm ci
        working-directory: workers/api
      - name: run checks
        run: ./scripts/check.sh

  release-apk:
    name: release APK static check (JNI classes survive R8)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: build release APK
        run: flutter build apk --release
        working-directory: apps/mobile
      - name: verify ONNX classes were not stripped
        run: ./scripts/check-release-apk.sh
